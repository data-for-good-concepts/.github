<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Model Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-screen 3D model, floating title bar on top, collapsible control sheet at the bottom. */
  :root {
    --scene: #e6eae8;
    --surface: rgba(250, 252, 251, 0.92);
    --surface-solid: #fafcfb;
    --line: rgba(32, 52, 52, 0.14);
    --fg: #172423;
    --muted: #5b6d6b;
    --accent: #2f6f73;
    --accent-fg: #ffffff;
    --chip-off: rgba(32, 52, 52, 0.06);
    --danger: #b3412f;
    --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --scene: #131a1a;
      --surface: rgba(26, 34, 34, 0.9);
      --surface-solid: #1a2222;
      --line: rgba(200, 225, 222, 0.14);
      --fg: #e4eeec;
      --muted: #98aba8;
      --accent: #7cc4c2;
      --accent-fg: #0d1a1a;
      --chip-off: rgba(200, 225, 222, 0.07);
      --danger: #f08a76;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --scene: #131a1a;
    --surface: rgba(26, 34, 34, 0.9);
    --surface-solid: #1a2222;
    --line: rgba(200, 225, 222, 0.14);
    --fg: #e4eeec;
    --muted: #98aba8;
    --accent: #7cc4c2;
    --accent-fg: #0d1a1a;
    --chip-off: rgba(200, 225, 222, 0.07);
    --danger: #f08a76;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--scene);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    padding-bottom: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .title-block {
    min-width: 0; flex: 1;
    background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 14px;
  }
  .title-block h1 {
    margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title-block p { margin: 2px 0 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .btn {
    font: 600 14px/1 var(--font-body);
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg);
    padding: 11px 14px; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn:focus-visible, .seg button:focus-visible, .chip:focus-visible, .switch input:focus-visible + span {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  #info {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 84px);
    background: var(--surface-solid); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.12);
    max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #info b { font-weight: 600; }
  #info .dims { font-family: var(--font-data); font-size: 12px; color: var(--muted); margin-left: 6px; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    padding-top: 6px;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 12px;
    max-width: 760px; margin: 0 auto;
  }
  @media (min-width: 800px) {
    .sheet { left: 50%; right: auto; width: 760px; transform: translateX(-50%); bottom: 16px; border-radius: 18px; border: 1px solid var(--line); padding-bottom: 14px; }
  }
  .grab {
    justify-self: center; width: 100%; height: 22px; border: 0; background: none; cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  .grab span { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
  .sheet.collapsed .collapsible { display: none; }

  .stats { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .stats::-webkit-scrollbar { display: none; }
  .stat { flex: none; }
  .stat .v { font-family: var(--font-data); font-weight: 500; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; font: 500 13px/1 var(--font-body); color: var(--fg);
    border: 1px solid var(--line); background: var(--chip-off); border-radius: 999px;
    padding: 8px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .sw { width: 10px; height: 10px; border-radius: 3px; }
  .chip .a { font-family: var(--font-data); font-size: 11px; color: var(--muted); }
  .chip[aria-pressed="false"] { opacity: .45; }
  .chip[aria-pressed="false"] .sw { background: transparent !important; outline: 1.5px solid var(--muted); outline-offset: -1.5px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; padding: 3px; background: var(--chip-off); }
  .seg button {
    font: 600 13px/1 var(--font-body); color: var(--muted); background: none; border: 0;
    padding: 9px 14px; border-radius: 9px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--surface-solid); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch span { width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface-solid); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .spacer { flex: 1; }

  .hint { font-size: 12px; color: var(--muted); }
  .progress { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress .track { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .progress .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .error { font-size: 13px; color: var(--danger); }
  .sample-tag {
    font: 600 10px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 3px 5px; margin-left: 6px; vertical-align: 2px;
  }

  #drop {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: color-mix(in srgb, var(--scene) 80%, transparent);
    font: 600 20px var(--font-display); color: var(--accent);
    border: 3px dashed var(--accent);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>body{margin:0}</style>
</head>
<body>


<div id="stage"><canvas id="c" aria-label="3D model of the house"></canvas></div>

<header class="bar">
  <div class="title-block">
    <h1 id="name">Loading…</h1>
    <p id="sub">House Scanner model viewer</p>
  </div>
  <label class="btn primary" for="file" title="Open house-scan.zip (with textures) or house-scene.json from the House Scanner app">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
    Open scan
  </label>
  <input id="file" type="file" accept=".zip,.json,application/zip,application/json" hidden>
</header>

<div id="info" hidden></div>

<section class="sheet" id="sheet" aria-label="Model controls">
  <button class="grab" id="grab" aria-label="Show or hide controls" aria-expanded="true"><span></span></button>
  <div class="stats" id="stats"></div>
  <div class="collapsible" style="display:grid;gap:12px">
    <div class="chips" id="rooms" aria-label="Rooms"></div>
    <div class="seg" role="group" aria-label="Level" id="levels" hidden></div>
    <div class="row">
      <div class="seg" role="group" aria-label="View">
        <button id="v-orbit" aria-pressed="true">3D</button>
        <button id="v-top" aria-pressed="false">Plan</button>
        <button id="v-walk" aria-pressed="false">Walk</button>
      </div>
      <div class="seg" role="group" aria-label="Look" id="look" hidden>
        <button id="l-model" aria-pressed="true">Model</button>
        <button id="l-splats" aria-pressed="false">Splats</button>
      </div>
      <label class="switch" for="cut"><input id="cut" type="checkbox" checked><span></span>Cutaway</label>
      <label class="switch" for="tex" id="tex-wrap" hidden><input id="tex" type="checkbox" checked><span></span>Textures</label>
      <div class="spacer"></div>
      <button class="btn" id="reset">Reset view</button>
    </div>
    <div class="hint" id="hint">Drag to rotate · pinch to zoom · two fingers to pan · tap furniture for its size</div>
    <div class="progress" id="progress" hidden><div class="track"><div class="fill" id="progress-fill"></div></div><span id="progress-text"></span></div>
    <div class="error" id="err" hidden></div>
  </div>
</section>

<div id="drop" hidden>Drop house-scan.zip or house-scene.json</div>
