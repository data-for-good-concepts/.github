<!doctype html><html><body style="margin:0">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
const W = 960, H = 720, FX = 712;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
function noise(g, w, h, amt) {
  const d = g.getImageData(0, 0, w, h);
  for (let i = 0; i < d.data.length; i += 4) { const n = (Math.random() - .5) * amt; d.data[i] += n; d.data[i+1] += n; d.data[i+2] += n; }
  g.putImageData(d, 0, 0);
}
// Wall texture spans 1 m wide x 2.5 m tall (256 x 640 px).
function wallTex(base, band) {
  return canvasTex(256, 640, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    if (band === 'tiles' || band === 'bath') {
      const top = band === 'bath' ? 1.5 : 1.45, bottom = band === 'bath' ? 0 : 0.9;
      const y0 = h - top / 2.5 * h, y1 = h - bottom / 2.5 * h;
      g.fillStyle = band === 'bath' ? '#e9eef0' : '#f2efe6'; g.fillRect(0, y0, w, y1 - y0);
      g.strokeStyle = band === 'bath' ? '#a9b7bd' : '#b8b0a0'; g.lineWidth = 2;
      const s = band === 'bath' ? 256 / 5 : 256 / 6.67;
      for (let y = y1; y > y0; y -= s / (band === 'bath' ? 1 : 2)) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
      for (let x = 0; x <= w; x += s) { g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke(); }
    }
    g.fillStyle = '#f7f6f2'; g.fillRect(0, h - 0.1 / 2.5 * h, w, 0.1 / 2.5 * h);
    g.fillStyle = '#d8d6d0'; g.fillRect(0, h - 0.1 / 2.5 * h, w, 2);
    noise(g, w, h, 10);
  });
}
const planks = canvasTex(512, 512, (g, w, h) => {
  const n = 6, ph = h / n;
  for (let i = 0; i < n; i++) {
    let x = -Math.random() * w;
    while (x < w) {
      const len = w * (0.6 + Math.random() * 0.8);
      const l = 52 + Math.random() * 10;
      g.fillStyle = `hsl(32, 42%, ${l}%)`; g.fillRect(x, i * ph, len, ph);
      g.strokeStyle = 'rgba(80,50,20,.18)'; g.lineWidth = 1;
      for (let k = 0; k < 6; k++) { const yy = i * ph + Math.random() * ph; g.beginPath(); g.moveTo(x, yy); g.bezierCurveTo(x + len * .3, yy + 4, x + len * .6, yy - 4, x + len, yy); g.stroke(); }
      g.strokeStyle = 'rgba(60,35,15,.55)'; g.lineWidth = 2; g.strokeRect(x, i * ph, len, ph);
      x += len;
    }
  }
  noise(g, w, h, 8);
});
function floorTiles(color, line, n) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = color; g.fillRect(0, 0, w, h);
    g.strokeStyle = line; g.lineWidth = 3;
    for (let i = 0; i <= n; i++) { const p = i * w / n; g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
    noise(g, w, h, 12);
  });
}
function painting(seed) {
  return canvasTex(256, 192, (g, w, h) => {
    const hues = [[12, 200, 45], [210, 40, 160], [140, 30, 260]][seed % 3];
    g.fillStyle = `hsl(${hues[0]},45%,85%)`; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 7; i++) { g.fillStyle = `hsla(${hues[i % 3]},55%,${40 + i * 6}%,.85)`; g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 20 + Math.random() * 50, 0, 7); g.fill(); }
    g.strokeStyle = '#2b2b2b'; g.lineWidth = 12; g.strokeRect(0, 0, w, h);
  });
}

const ROOM_STYLE = [
  { wall: wallTex('#d9cfc0'), floor: planks, floorRepeat: 1.6 },
  { wall: wallTex('#c7d1bf', 'tiles'), floor: floorTiles('#b9b7b2', '#8e8b85', 2), floorRepeat: 1.66 },
  { wall: wallTex('#cbd3de'), floor: planks, floorRepeat: 1.6 },
  { wall: wallTex('#eef0f0', 'bath'), floor: floorTiles('#e8ecee', '#a7b3b8', 5), floorRepeat: 1 },
];
const OBJ = { sofa: 0x5f7896, chair: 0x8a9a74, table: 0x8d6a45, bed: 0xe8e4dc, storage: 0xb59c7c, refrigerator: 0xd6dbde, stove: 0x3d3f42,
  dishwasher: 0xcfd4d6, sink: 0xd0d8dd, washerDryer: 0xe4e7e9, toilet: 0xf4f5f6, bathtub: 0xf1f3f4, television: 0x1d1f21 };

window.generate = (data) => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdde3e6);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9c8f80, 1.5));
  const sun = new THREE.DirectionalLight(0xfff4e6, 1.3); sun.position.set(14, 12, 9); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
  sun.target.position.set(4.4, 0, 4.2); scene.add(sun, sun.target);
  const ceilingLight = new THREE.PointLight(0xfff1dc, 6, 0, 1.5);
  scene.add(ceilingLight);

  const mat4 = (a) => new THREE.Matrix4().fromArray(a);
  data.rooms.forEach((room, ri) => {
    const st = ROOM_STYLE[ri % ROOM_STYLE.length];
    for (const w of room.walls) {
      const tex = st.wall.clone(); tex.needsUpdate = true; tex.repeat.set(w.size[0], 1);
      const g = new THREE.PlaneGeometry(w.size[0], w.size[1]);
      // The interior is on the side facing the room centre: flip planes so they face inward.
      const m = mat4(w.matrix);
      const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: .95, side: THREE.DoubleSide }));
      mesh.applyMatrix4(m); mesh.receiveShadow = true; mesh.castShadow = true;
      scene.add(mesh);
    }
    for (const d of room.doors) {
      const g = new THREE.PlaneGeometry(d.size[0], d.size[1]);
      const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: d.isOpen ? 0x6c665e : 0xf3f1ea, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 }));
      mesh.applyMatrix4(mat4(d.matrix)); scene.add(mesh);
    }
    for (const win of room.windows) {
      const g = new THREE.PlaneGeometry(win.size[0], win.size[1]);
      const c = document.createElement('canvas'); c.width = 128; c.height = 128; const x = c.getContext('2d');
      const grd = x.createLinearGradient(0, 0, 0, 128); grd.addColorStop(0, '#9fc6e6'); grd.addColorStop(.7, '#d4e6f1'); grd.addColorStop(.71, '#7f9f6a'); grd.addColorStop(1, '#6b8a58');
      x.fillStyle = grd; x.fillRect(0, 0, 128, 128); x.strokeStyle = '#fafafa'; x.lineWidth = 8; x.strokeRect(0, 0, 128, 128); x.beginPath(); x.moveTo(64, 0); x.lineTo(64, 128); x.stroke();
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: t, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 }));
      mesh.applyMatrix4(mat4(win.matrix)); scene.add(mesh);
    }
    for (const f of room.floors) {
      const xs = f.corners.map(c => c[0]), zs = f.corners.map(c => c[2]);
      const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...zs) - Math.min(...zs);
      const tex = st.floor.clone(); tex.needsUpdate = true; tex.repeat.set(w / st.floorRepeat, h / st.floorRepeat);
      const g = new THREE.PlaneGeometry(w, h); g.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: .8 }));
      mesh.position.set(Math.min(...xs) + w / 2, 0, Math.min(...zs) + h / 2); mesh.receiveShadow = true;
      scene.add(mesh);
    }
    for (const o of room.objects) {
      const g = new THREE.BoxGeometry(...o.size);
      const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: OBJ[o.category] ?? 0x999999, roughness: .7 }));
      mesh.applyMatrix4(mat4(o.matrix)); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
    }
  });
  // Paintings: on the living room back wall (z = 4.2 is shared; use z just inside room 0 at z=4.19 facing -z) and bedroom.
  const pics = [[1.4, 1.6, 4.19, 0, 1.0, 0.75, 0], [3.4, 1.55, 4.19, 0, 0.6, 0.8, 1], [0.01, 1.5, 2.1, 1, 0.9, 0.65, 2], [2.3, 1.45, 4.21, 2, 1.2, 0.8, 0]];
  for (const [x, y, z, face, w, h, s] of pics) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: painting(s), side: THREE.DoubleSide }));
    m.position.set(x, y, z);
    if (face === 1) { m.rotation.y = Math.PI / 2; m.position.x = 0.02; }
    scene.add(m);
  }

  const cam = new THREE.PerspectiveCamera(2 * Math.atan(H / 2 / FX) * 180 / Math.PI, W / H, 0.05, 100);
  cam.rotation.order = 'YXZ';
  const frames = [], images = [];
  const shoot = (x, z, yaw, pitch) => {
    cam.position.set(x, 1.45 + (Math.random() - .5) * .1, z);
    cam.rotation.set(pitch, yaw, (Math.random() - .5) * .04);
    cam.updateMatrixWorld(true);
    ceilingLight.position.set(x, 2.4, z);
    renderer.render(scene, cam);
    const n = frames.length + 1;
    const file = `keyframes/${String(n).padStart(4, '0')}.jpg`;
    images.push([file, renderer.domElement.toDataURL('image/jpeg', 0.8)]);
    frames.push({ file, time: n * 0.5, width: W, height: H, intrinsics: [FX, FX, W / 2, H / 2],
      transform: Array.from(cam.matrixWorld.elements).map(v => Math.round(v * 1e6) / 1e6) });
  };
  const D = Math.PI / 180;
  data.rooms.forEach((room) => {
    const xs = room.floors[0].corners.map(c => c[0]), zs = room.floors[0].corners.map(c => c[2]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    for (let a = 0; a < 360; a += 45) shoot(cx, cz, a * D, -12 * D);
    for (let a = 0; a < 360; a += 90) shoot(cx, cz, (a + 45) * D, -55 * D);
    for (let a = 0; a < 360; a += 60) shoot(cx, cz, (a + 20) * D, 22 * D);
    for (const [fx, fz] of [[0.25, 0.25], [0.75, 0.25], [0.75, 0.75], [0.25, 0.75]]) {
      const px = x0 + (x1 - x0) * fx, pz = z0 + (z1 - z0) * fz;
      const yaw = Math.atan2(-(cx - px), -(cz - pz));
      shoot(px, pz, yaw + 35 * D, -18 * D);
      shoot(px, pz, yaw - 35 * D, -18 * D);
    }
  });
  return { frames, images };
};
window.ready = true;
</script></body></html>
